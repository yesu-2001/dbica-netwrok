<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <!-- DBICA Official Emblem - Don Bosco Institute of Communication Arts -->
  <g id="dbica-emblem" transform="translate(20, 8)">
    <!-- Outer Navy Loop Left -->
    <path d="M 100 12 C 60 36 40 76 48 116 C 54 136 68 152 92 168 L 100 174" stroke="#0F5C97" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Outer Navy Loop Right -->
    <path d="M 100 12 C 140 36 160 76 152 116 C 148 126 142 136 134 146" stroke="#0F5C97" stroke-width="8.5" stroke-linecap="round"/>
    <!-- Outer Right Lower - Green Accent -->
    <path d="M 134 146 C 124 158 112 168 100 174" stroke="#62B534" stroke-width="8.5" stroke-linecap="round"/>

    <!-- Middle Ribbon Left - Red-Orange Top -->
    <path d="M 100 28 C 80 44 68 66 66 90" stroke="#EA4A2B" stroke-width="8.5" stroke-linecap="round"/>
    <!-- Middle Ribbon Left - Amber/Yellow -->
    <path d="M 66 90 C 65 99 66 108 68 118" stroke="#F59E1B" stroke-width="8.5" stroke-linecap="round"/>
    <!-- Middle Ribbon Left - Blue Bottom -->
    <path d="M 68 118 C 72 134 84 148 100 160" stroke="#0F5C97" stroke-width="8.5" stroke-linecap="round"/>

    <!-- Middle Ribbon Right - Blue Top -->
    <path d="M 100 28 C 120 44 132 66 134 90 C 135 101 133 112 128 122" stroke="#0F5C97" stroke-width="8.5" stroke-linecap="round"/>
    <!-- Middle Ribbon Right - Cyan / Green -->
    <path d="M 128 122 C 124 132 114 146 100 160" stroke="#00A0DC" stroke-width="8.5" stroke-linecap="round"/>

    <!-- Inner Ribbon Left - Red Top -->
    <path d="M 100 44 C 90 54 82 66 80 80" stroke="#EA4A2B" stroke-width="8.5" stroke-linecap="round"/>
    <!-- Inner Ribbon Left - Amber -->
    <path d="M 80 80 C 79 88 80 96 82 104" stroke="#F59E1B" stroke-width="8.5" stroke-linecap="round"/>
    <!-- Inner Ribbon Left - Blue -->
    <path d="M 82 104 C 86 116 92 128 100 144" stroke="#0F5C97" stroke-width="8.5" stroke-linecap="round"/>

    <!-- Inner Ribbon Right - Blue Top -->
    <path d="M 100 44 C 110 54 118 66 120 80 C 121 90 119 100 114 110" stroke="#0F5C97" stroke-width="8.5" stroke-linecap="round"/>
    <!-- Inner Ribbon Right - Cyan Accent -->
    <path d="M 114 110 C 110 120 106 130 100 144" stroke="#00A0DC" stroke-width="8.5" stroke-linecap="round"/>

    <!-- Center Base Stem Connection -->
    <path d="M 100 144 L 100 174" stroke="#0F5C97" stroke-width="8.5" stroke-linecap="round"/>
  </g>

  <!-- DBICA Bold Brand Typography -->
  <text x="120" y="220" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#0F5C97" letter-spacing="2">DBICA</text>
</svg>
